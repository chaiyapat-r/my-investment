services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "5435:5432"   # host 5435 to avoid clashing with other local Postgres containers
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

  # api and web are behind the "full" profile so plain `docker compose up -d db`
  # (the dev workflow) never starts them and grabs ports 5153/3000. Bring the
  # whole stack up only for a deploy rehearsal: `docker compose --profile full up`.
  api:
    build: ./backend
    profiles: ["full"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=portfolio;Username=portfolio;Password=portfolio"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5153:8080"

  web:
    build:
      context: ./frontend
    profiles: ["full"]
    environment:
      # Read at request time by the API route handlers (src/lib/api/backend.ts),
      # so it must be a runtime env — not a build arg.
      API_PROXY_URL: "http://api:8080"
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
